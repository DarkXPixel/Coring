<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовая страница</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #1a1a1a;
        }

        p {
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #0052a3;
        }

        #result {
            margin-top: 1rem;
            font-weight: bold;
            color: #0066cc;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Тестовый заголовок</h1>
        <p>Это простая тестовая HTML-страница со стилями и скриптом. Нажмите кнопку ниже, чтобы проверить работу JavaScript.</p>
        <button id="testBtn">Нажми меня</button>
        <div id="result"></div>
    </div>

    <script>
        const button = document.getElementById('testBtn');
        const result = document.getElementById('result');
        let count = 0;

        button.addEventListener('click', () => {
            count++;
            result.textContent = `Кнопка нажата: ${count} ${getNounPlural(count, 'раз', 'раза', 'раз')}`;
        });

        function getNounPlural(number, one, two, five) {
            let n = Math.abs(number);
            n %= 100;
            if (n >= 5 && n <= 20) return five;
            n %= 10;
            if (n === 1) return one;
            if (n >= 2 && n <= 4) return two;
            return five;
        }
    </script>

</body>
</html>
