# Coring5 HTTP/1 reverse proxy for a local HTTP backend.
# Validate with: coringd --config deploy/coring.example.toml --check-config

# Runtime settings size each worker at startup and require a restart to change.
[runtime]
workers = 2
max_connections_per_worker = 10000
buffer_count = 1024
buffer_size = 16384
ring_sq_entries = 2048
ring_cq_entries = 8192
tick_ms = 50
drain_timeout_ms = 10000
reload_ack_timeout_ms = 5000
# cpus = [0, 1]                  # optional pinning, one CPU per worker
# relay_memory_mib = 256         # per worker for L4 and HTTP body chunks
# http1_stage_bytes = 0          # auto: startup max_head_bytes + buffer_size

# Optional HTTP/1 access log. Changes require a daemon restart.
# The coringd service needs write access to the log directory.
# [access_log]
# path = "/var/log/coring/access.log" # parent directory must exist
# rotate_bytes = 10485760             # set both rotation keys, or omit both
# rotate_files = 5                    # 1..255 archives, .1 is newest

[limits]
idle_timeout_ms = 60000
header_timeout_ms = 10000
connect_timeout_ms = 3000
keepalive_timeout_ms = 60000
max_head_bytes = 16384
max_headers = 100
max_uri_bytes = 8192
queue_high_watermark = 262144
queue_low_watermark = 65536
max_requests = 1000              # 0 = unlimited requests per HTTP connection
max_request_body_bytes = 0       # 0 = unlimited request body size

[[listener]]
name = "http"
address = "0.0.0.0:9000"
protocol = "http1"
route = "site"

# The default virtual host and root prefix match every host and path.
[[route_set]]
name = "site"

[[route_set.vhost]]
default = true

[[route_set.vhost.location]]
path = "/"
match = "prefix"
action = "reverse_proxy"
upstream = "backends"

[[upstream]]
name = "backends"
backends = ["127.0.0.1:8080"]
policy = "round_robin"
max_fails = 3
eject_time_ms = 10000
